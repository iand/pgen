name: Bump version
on:
  workflow_run:
    workflows: ["Run tests"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Gorelease
        id: release
        env:
          GOPRIVATE: github.com/iand  # read versions from GitHub, not the proxy's cached list
        run: |
          set -o pipefail
          go install golang.org/x/exp/cmd/gorelease@v0.0.0-20261121134650-e1094eeca1b5
          gorelease | tee "$RUNNER_TEMP/gorelease.txt"
          echo "version=$(sed -n 's/^Suggested version: v\([^ ]*\).*/\1/p' "$RUNNER_TEMP/gorelease.txt")" >> "$GITHUB_OUTPUT"

      - name: Tag release
        if: ${{ steps.release.outputs.version != '' }}
        uses: mathieudutour/github-tag-action@v6.2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.release.outputs.version }}
          commit_sha: ${{ github.event.workflow_run.head_sha }}
